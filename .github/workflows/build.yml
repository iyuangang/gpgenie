name: Build and Release

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
    paths-ignore:
      - "**/*.md"
      - LICENSE
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - "**/*.md"
      - LICENSE
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly
  CGO_ENABLED: 0

jobs:
  build:
    name: Cross-platform build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Verify dependencies
        run: |
          go mod download
          go mod verify

      - name: Build Linux, Windows, and macOS
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/gpgenie-linux-amd64 ./cmd/gpgenie
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/gpgenie-windows-amd64.exe ./cmd/gpgenie
          GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/gpgenie-darwin-amd64 ./cmd/gpgenie

      - name: Upload binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gpgenie-binaries-${{ github.run_attempt }}
          path: dist/gpgenie-*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  release:
    name: GitHub Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gpgenie-binaries-${{ github.run_attempt }}
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/gpgenie-*
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          generate_release_notes: true
