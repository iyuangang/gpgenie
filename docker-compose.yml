version: '3.8'

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: youruser
      POSTGRES_PASSWORD: yourpassword
      POSTGRES_DB: gpgenie_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U youruser -d gpgenie_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  gpgenie:
    build: .
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./config:/app/config
      - ./export:/output
    command: ["--config", "/app/config/config.json", "generate"]
    environment:
      - GPGENIE_DATABASE_HOST=db
      - GPGENIE_DATABASE_PORT=5432
      - GPGENIE_DATABASE_USER=youruser
      - GPGENIE_DATABASE_PASSWORD=yourpassword
      - GPGENIE_DATABASE_DBNAME=gpgenie_db

volumes:
  db_data:
